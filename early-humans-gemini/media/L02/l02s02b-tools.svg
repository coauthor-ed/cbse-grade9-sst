  <g stroke="#4f4a42" stroke-width="2" stroke-linejoin="round">
    <path d="M 160 115 C 172 140 190 185 200 240 C 210 295 214 350 210 405 C 206 455 196 505 172 528 C 164 536 156 536 148 528 C 124 505 114 455 110 405 C 106 350 110 295 120 240 C 130 185 148 140 160 115 Z" fill="url(#stoneA)"/>
    <path d="M 162 150 L 198 240 L 162 262 Z" fill="#9c958a" stroke-width="1.2"/>
    <path d="M 158 150 L 122 240 L 158 262 Z" fill="#a49d92" stroke-width="1.2"/>
    <path d="M 162 262 L 206 360 L 162 384 Z" fill="#8f887d" stroke-width="1.2"/>
    <path d="M 158 262 L 114 360 L 158 384 Z" fill="#9a9388" stroke-width="1.2"/>
    <path d="M 162 384 L 197 470 L 162 502 Z" fill="#a19a8f" stroke-width="1.2"/>
    <path d="M 158 384 L 123 470 L 158 502 Z" fill="#8b8478" stroke-width="1.2"/>
