<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" font-family="Verdana, 'DejaVu Sans', sans-serif">
  <title>Paleolithic food-processing tools</title>
  <defs>
    <linearGradient id="stoneA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aaa398"/><stop offset="0.55" stop-color="#8d867b"/><stop offset="1" stop-color="#6c665c"/>
    </linearGradient>
    <linearGradient id="stoneB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8b2a6"/><stop offset="1" stop-color="#847d72"/>
    </linearGradient>
    <linearGradient id="flint" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#5a5a66"/><stop offset="0.5" stop-color="#43434e"/><stop offset="1" stop-color="#2f2f3a"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d968a"/><stop offset="1" stop-color="#6f6a60"/>
    </linearGradient>
    <radialGradient id="meatG" cx="0.4" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#c95a52"/><stop offset="0.7" stop-color="#a83c38"/><stop offset="1" stop-color="#7e2a28"/>
    </radialGradient>
  </defs>

  <rect width="960" height="640" fill="#f3ecdc"/>
  <rect x="12" y="12" width="936" height="616" fill="none" stroke="#d8cdb4" stroke-width="2"/>

