    <path d="M 380 175 l 13 22 l -20 -8 z M 424 170 l 12 24 l -20 -9 z M 470 169 l 11 25 l -19 -10 z M 516 172 l 10 23 l -18 -9 z M 558 179 l 10 21 l -17 -9 z" fill="#6b6b78"/>
    <path d="M 400 244 l 12 -22 l -19 8 z M 448 246 l 11 -23 l -18 9 z M 494 243 l 10 -22 l -17 9 z M 540 236 l 10 -20 l -16 9 z" fill="#565664"/>
    <path d="M 360 184 C 430 170 505 172 560 187" stroke="#9a9aa6" stroke-width="1.4" fill="none" opacity="0.8"/>
  </g>

