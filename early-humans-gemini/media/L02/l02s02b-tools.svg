  <!-- Chopping tool (core chopper) -->
  <g>
    <path d="M 740 468 C 734 438 748 410 772 396 C 800 380 842 378 866 396 C 888 412 894 446 882 476 C 870 506 836 522 804 518 C 772 514 746 498 740 468 Z" fill="url(#stoneA)" stroke="#4a453e" stroke-width="2"/>
    <path d="M 744 462 L 726 448 L 744 436 L 730 420 L 752 410 L 744 396" fill="none" stroke="#3d3933" stroke-width="3" stroke-linecap="round"/>
    <path d="M 760 430 L 810 440 L 800 480 L 752 474 Z" fill="#948d81" opacity="0.8"/>
    <path d="M 800 408 L 852 420 L 846 462 L 806 442 Z" fill="#a29b8f" opacity="0.8"/>
    <path d="M 760 486 L 812 492 L 840 470 L 846 492 L 812 508 L 776 502 Z" fill="#8a8377" opacity="0.8"/>
