  <!-- Meat haunch on stone slab -->
  <g>
    <path d="M 322 486 C 314 462 336 446 372 441 L 598 424 C 630 422 648 436 647 458 C 646 480 626 494 594 498 L 364 514 C 334 516 328 508 322 486 Z" fill="url(#slab)" stroke="#57524a" stroke-width="2"/>
