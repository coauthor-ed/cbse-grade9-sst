    <path d="M 380 452 C 372 410 400 376 446 368 C 498 358 556 370 584 398 C 608 422 602 456 570 472 C 530 491 470 493 430 481 C 402 472 386 464 380 452 Z" fill="url(#meatG)" stroke="#5f1f1d" stroke-width="2"/>
    <path d="M 412 444 C 444 424 506 418 556 430" stroke="#f0e0d2" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M 428 414 C 456 402 500 400 532 410" stroke="#e9cfc0" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <circle cx="586" cy="378" r="18" fill="#e8dcc8" stroke="#b7a586" stroke-width="2"/>
    <circle cx="586" cy="378" r="8" fill="#f7efe2"/>
    <path d="M 440 462 l 24 -34 M 470 466 l 24 -36 M 500 464 l 22 -34" stroke="#4a1715" stroke-width="2.5" opacity="0.75"/>
  </g>

</svg>
