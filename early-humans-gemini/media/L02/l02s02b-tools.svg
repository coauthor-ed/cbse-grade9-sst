    <path d="M 126 205 Q 160 228 194 205 M 120 320 Q 160 344 200 320 M 126 428 Q 160 450 194 428" stroke="#5d574e" stroke-width="1" fill="none" opacity="0.5"/>
  </g>

  <!-- Flint knife with bound handle -->
  <g>
    <path d="M 300 178 C 290 178 284 186 284 197 L 284 216 C 284 227 290 235 300 235 L 356 236 L 356 178 Z" fill="#7a5a38" stroke="#5a4028" stroke-width="2"/>
    <path d="M 296 182 L 292 231 M 310 181 L 306 233 M 324 180 L 320 234 M 338 179 L 335 235" stroke="#59422a" stroke-width="2.5"/>
    <path d="M 352 182 C 430 166 510 168 566 184 C 596 192 618 200 630 207 C 618 216 596 224 566 231 C 510 246 430 248 352 232 Z" fill="url(#flint)" stroke="#23232c" stroke-width="2" stroke-linejoin="round"/>
