  <ellipse cx="480" cy="524" rx="175" ry="13" fill="#000" opacity="0.07"/>
  <ellipse cx="810" cy="322" rx="85" ry="11" fill="#000" opacity="0.07"/>
  <ellipse cx="812" cy="546" rx="90" ry="11" fill="#000" opacity="0.07"/>

